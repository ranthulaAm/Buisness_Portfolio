<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite/HMR WebSocket connection closed/failed errors & unhandled rejections
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message === 'WebSocket closed without opened.' ||
          (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
          (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
          (event.reason.stack && event.reason.stack.includes('vite'))
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
      window.addEventListener('error', function(event) {
        if (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('vite')
        )) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Ranthula | Buisness portfolio</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ranthulaAm/App/main/img/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
              display: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            },
            fontSize: {
              xs: ['12px', { lineHeight: '16px', letterSpacing: '0em' }], // Caption 2
              sm: ['13px', { lineHeight: '18px', letterSpacing: '-0.01em' }], // Footnote / Caption 1
              base: ['17px', { lineHeight: '22px', letterSpacing: '-0.022em' }], // Body
              lg: ['20px', { lineHeight: '25px', letterSpacing: '-0.022em' }], // Title 3
              xl: ['22px', { lineHeight: '28px', letterSpacing: '-0.026em' }], // Title 2
              '2xl': ['28px', { lineHeight: '34px', letterSpacing: '-0.026em' }], // Title 1
              '3xl': ['34px', { lineHeight: '41px', letterSpacing: '-0.026em' }], // Large Title
              '4xl': ['41px', { lineHeight: '49px', letterSpacing: '-0.026em' }],
              '5xl': ['48px', { lineHeight: '54px', letterSpacing: '-0.026em' }],
            },
            colors: {
              bg: {
                dark: '#050505',
                light: '#121212',
              },
              text: {
                light: '#E0E0E0',
                muted: '#A0A0A0',
              },
              accent: {
                purple: '#D500F9',
                magenta: '#FF1744',
                orange: '#FF9100',
                green: '#00E676',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out forwards',
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'gradient': 'gradient 8s ease infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              gradient: {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --text-light: #111827;
      }
      
      html {
        background-color: #f9fafb;
        min-height: 100%;
      }

      body {
        background-color: transparent;
        color: var(--text-light);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .animate-gradient {
        background-size: 200% auto;
      }

      /* Endel-style Glass Effect */
      .glass-effect {
        background: rgba(18, 18, 18, 0.85);
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0,0,0,0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      }

      /* Custom Animations for Service Cards */
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
      }
      
      @keyframes ripple {
        0% { transform: scale(0.5); opacity: 0.8; stroke-width: 4px; }
        100% { transform: scale(2.5); opacity: 0; stroke-width: 0px; }
      }

      @keyframes page-flip {
        0% { transform: rotateY(0deg); }
        15% { transform: rotateY(-180deg); }
        100% { transform: rotateY(-180deg); }
      }
      
      @keyframes draw-line {
        0% { stroke-dasharray: 0, 100; opacity: 0; }
        10% { opacity: 1; }
        50% { stroke-dasharray: 100, 0; opacity: 1; }
        100% { stroke-dasharray: 100, 0; opacity: 0; }
      }

      @keyframes spin-3d {
        0% { transform: rotateY(0deg) rotateX(20deg); }
        100% { transform: rotateY(360deg) rotateX(20deg); }
      }

      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(40px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
      }

      /* NEW: Banners - Parallax Scrolling */
      @keyframes banner-scroll {
        0% { transform: translateX(-20%); }
        50% { transform: translateX(20%); }
        100% { transform: translateX(-20%); }
      }
      
      /* NEW: Shop Sign Swing */
      @keyframes swing {
        0%, 100% { transform: rotate(5deg); }
        50% { transform: rotate(-5deg); }
      }

      /* NEW: Flyers - Fanning Out */
      @keyframes fan-out-left {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        50% { transform: rotate(-15deg) translateX(-10px); }
      }
      @keyframes fan-out-right {
        0%, 100% { transform: rotate(0deg) translateX(0); }
        50% { transform: rotate(15deg) translateX(10px); }
      }

      /* NEW: Tute Covers - Stack Expansion */
      @keyframes stack-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(var(--tx), var(--ty)) scale(1.05); }
      }

      /* NEW: Social Scroll Animation */
      @keyframes scroll-feed {
        0% { transform: translateY(0); }
        100% { transform: translateY(-55px); }
      }
      @keyframes scroll-touch {
        0% { transform: translate(0, 30px); opacity: 0; }
        20% { opacity: 0.5; }
        60% { transform: translate(0, -30px); opacity: 0.5; }
        80% { opacity: 0; }
        100% { opacity: 0; }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }

      /* Global Button Micro-interactions */
      button {
        transition: all 200ms ease-in-out !important;
      }
      button:not(:disabled):hover {
        transform: translateY(-2px) !important;
      }
      button:not(:disabled):active {
        transform: scale(0.95) !important;
      }

      /* Dark Mode Base - Apple iOS Guidelines */
      html.dark body {
        background-color: #18181b; /* Elevated black for base */
        color: #ffffff; /* Pure white for text */
      }

      /* Prevent images and videos from getting dim, dark, or losing color/contrast in dark mode */
      html.dark img, 
      html.dark video,
      html.dark iframe,
      html.dark canvas {
        filter: brightness(1) contrast(1) !important;
      }
    </style>
